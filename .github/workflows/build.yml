name: Build AI Player for Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Save compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
